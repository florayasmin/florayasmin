<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Animated stylized artworks">
  <defs>
    <clipPath id="stage">
      <rect width="1000" height="200"/>
    </clipPath>

    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="40%" stop-color="#14325a"/>
      <stop offset="100%" stop-color="#1a4a6d"/>
    </linearGradient>
    <linearGradient id="hillsBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#0c1724"/>
    </linearGradient>
    <linearGradient id="hillsFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="50%" stop-color="#f0c94d"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pondFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bb3b8"/>
      <stop offset="35%" stop-color="#7a9a86"/>
      <stop offset="70%" stop-color="#4e7563"/>
      <stop offset="100%" stop-color="#2d4c40"/>
    </linearGradient>
    <radialGradient id="petalPink" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5f3"/>
      <stop offset="55%" stop-color="#f0a3b6"/>
      <stop offset="100%" stop-color="#cc6d86"/>
    </radialGradient>
    <radialGradient id="petalCream" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="60%" stop-color="#f3d39a"/>
      <stop offset="100%" stop-color="#d4925a"/>
    </radialGradient>

    <linearGradient id="waveSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ead7b4"/>
      <stop offset="60%" stop-color="#c5d8e4"/>
      <stop offset="100%" stop-color="#8fb8c8"/>
    </linearGradient>
    <linearGradient id="waveBody" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#163a63"/>
      <stop offset="40%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#102c4e"/>
    </linearGradient>
    <linearGradient id="fujiSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#d9d0c3"/>
    </linearGradient>

    <filter id="rothkoSoft" x="-8%" y="-12%" width="116%" height="124%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="rothkoGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2218"/>
      <stop offset="100%" stop-color="#2a120e"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#stage)">

    <!-- Starry Night -->
    <g>
