        <path d="M16 54 C84 6 168 -8 262 14 C214 4 140 6 86 24 C54 36 30 50 16 54Z" fill="#f4f7f9"/>
        <path d="M48 44 C96 16 154 8 208 24 C164 34 104 48 48 44Z" fill="#102a4c"/>

        <g fill="#f7fafc">
          <path d="M200 22 C218 0 244 -6 268 12 C250 6 224 10 200 22Z"/>
          <path d="M266 8 C288 -12 318 -10 338 14 C316 2 290 4 266 8Z"/>
          <path d="M336 12 C358 -8 390 -6 408 18 C384 4 358 6 336 12Z"/>
          <path d="M404 16 C428 -4 462 0 476 26 C452 10 426 12 404 16Z"/>
          <path d="M470 22 C494 2 528 8 540 32 C518 14 492 16 470 22Z"/>
          <path d="M160 30 C176 12 198 8 216 26 C196 20 176 22 160 30Z"/>
          <path d="M112 38 C130 18 154 16 170 36 C150 30 130 32 112 38Z"/>
          <path d="M68 48 C86 30 108 28 122 46 C104 40 86 42 68 48Z"/>
          <ellipse cx="236" cy="24" rx="5" ry="3.4"/>
          <ellipse cx="304" cy="16" rx="6" ry="4"/>
          <ellipse cx="372" cy="18" rx="5.5" ry="3.6"/>
          <ellipse cx="438" cy="24" rx="6" ry="4"/>
          <ellipse cx="148" cy="38" rx="4.4" ry="3"/>
          <ellipse cx="96" cy="46" rx="4" ry="2.8"/>
