      <rect width="1000" height="200" fill="url(#pondFar)"/>
      <ellipse cx="200" cy="36" rx="300" ry="34" fill="#c9b7c4" opacity="0.28"/>
      <ellipse cx="640" cy="72" rx="360" ry="38" fill="#d9c5ae" opacity="0.2"/>
      <ellipse cx="420" cy="158" rx="440" ry="48" fill="#23483c" opacity="0.28"/>
      <ellipse cx="870" cy="118" rx="230" ry="32" fill="#8eae9c" opacity="0.18"/>
      <ellipse cx="80" cy="100" rx="120" ry="22" fill="#b7c9c0" opacity="0.16"/>

