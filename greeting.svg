          <ellipse cx="0" cy="-9.5" rx="5" ry="11.5" fill="url(#petalPink)" transform="rotate(72)"/>
          <ellipse cx="0" cy="-9.5" rx="5" ry="11.5" fill="url(#petalPink)" transform="rotate(144)"/>
          <ellipse cx="0" cy="-9.5" rx="5" ry="11.5" fill="url(#petalPink)" transform="rotate(216)"/>
          <ellipse cx="0" cy="-9.5" rx="5" ry="11.5" fill="url(#petalPink)" transform="rotate(288)"/>
          <circle r="4.5" fill="#f5d76e"/>
        </g>
        <g transform="translate(858 46)">
          <ellipse cx="0" cy="-8" rx="4.2" ry="10" fill="#f7e6ee"/>
          <ellipse cx="0" cy="-8" rx="4.2" ry="10" fill="#f4d5e0" transform="rotate(72)"/>
          <ellipse cx="0" cy="-8" rx="4.2" ry="10" fill="#f7e6ee" transform="rotate(144)"/>
          <ellipse cx="0" cy="-8" rx="4.2" ry="10" fill="#f4d5e0" transform="rotate(216)"/>
          <ellipse cx="0" cy="-8" rx="4.2" ry="10" fill="#f7e6ee" transform="rotate(288)"/>
          <circle r="3.8" fill="#efb0c0"/>
        </g>
        <g transform="translate(776 150)">
          <ellipse cx="0" cy="-9" rx="4.8" ry="11" fill="url(#petalCream)"/>
          <ellipse cx="0" cy="-9" rx="4.8" ry="11" fill="url(#petalCream)" transform="rotate(72)"/>
          <ellipse cx="0" cy="-9" rx="4.8" ry="11" fill="url(#petalCream)" transform="rotate(144)"/>
          <ellipse cx="0" cy="-9" rx="4.8" ry="11" fill="url(#petalCream)" transform="rotate(216)"/>
          <ellipse cx="0" cy="-9" rx="4.8" ry="11" fill="url(#petalCream)" transform="rotate(288)"/>
          <circle r="4.3" fill="#f3d27a"/>
