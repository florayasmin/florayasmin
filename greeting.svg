      <rect width="1000" height="200" fill="url(#nightSky)"/>

      <g fill="none" stroke-linecap="round">
        <path d="M180 70 C260 20 380 18 470 58 C400 40 300 48 230 78 C280 62 360 58 430 72" stroke="#3e618c" stroke-width="13">
          <animate attributeName="d" dur="8s" repeatCount="indefinite"
            values="M180 70 C260 20 380 18 470 58 C400 40 300 48 230 78 C280 62 360 58 430 72;
                    M190 62 C270 28 370 10 480 50 C410 36 310 54 240 70 C290 58 370 50 440 66;
                    M180 70 C260 20 380 18 470 58 C400 40 300 48 230 78 C280 62 360 58 430 72"/>
        </path>
        <path d="M500 36 C590 4 700 10 790 48 C720 22 620 18 540 44" stroke="#8fb4d4" stroke-width="8" opacity="0.85">
          <animate attributeName="d" dur="9s" repeatCount="indefinite"
            values="M500 36 C590 4 700 10 790 48 C720 22 620 18 540 44;
                    M510 42 C600 8 710 4 800 40 C730 16 630 24 550 50;
                    M500 36 C590 4 700 10 790 48 C720 22 620 18 540 44"/>
        </path>
        <path d="M60 90 C140 50 230 44 310 78" stroke="#2c4f78" stroke-width="11" opacity="0.8"/>
        <path d="M250 44 C330 8 430 14 510 46" stroke="#d5e4f2" stroke-width="4" opacity="0.45"/>
        <path d="M620 58 C690 28 780 32 860 64" stroke="#c5d8ea" stroke-width="5" opacity="0.4"/>
        <ellipse cx="430" cy="52" rx="92" ry="20" stroke="#6f93b8" stroke-width="10" opacity="0.55" transform="rotate(-18 430 52)"/>
        <ellipse cx="430" cy="52" rx="54" ry="11" stroke="#d7e6f4" stroke-width="4" opacity="0.4" transform="rotate(-18 430 52)"/>
      </g>

      <g transform="translate(805 40)">
        <circle r="46" fill="url(#moonGlow)"/>
        <circle r="17" fill="#ffe38a" filter="url(#starGlow)"/>
        <path d="M-8 -12 C8 -10 18 4 12 16 C2 8 -8 2 -8 -12Z" fill="#f4c441"/>
        <path d="M-28 -6 C-10 -28 18 -30 32 -8 C14 -22 -8 -20 -22 -4" fill="none" stroke="#e8d48a" stroke-width="3" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" values="0;12;0;-10;0" dur="10s" repeatCount="indefinite"/>
        </path>
      </g>

      <g filter="url(#starGlow)" fill="#f6e27a">
        <circle cx="118" cy="26" r="3.4"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="208" cy="16" r="2.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="318" cy="34" r="3.8"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="404" cy="14" r="2.3"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="528" cy="28" r="3.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
        <circle cx="612" cy="12" r="2.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="690" cy="36" r="3.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" begin="1.4s" repeatCount="indefinite"/></circle>
        <circle cx="918" cy="20" r="2.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></circle>
        <circle cx="966" cy="46" r="2.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="64" cy="50" r="2.1"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.7s" begin="1.7s" repeatCount="indefinite"/></circle>
      </g>

      <path d="M0 126 C110 108 210 136 340 116 C480 94 580 126 710 110 C820 98 910 120 1000 106 L1000 200 L0 200 Z" fill="url(#hillsBack)"/>
