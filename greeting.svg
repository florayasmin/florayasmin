        <rect x="768" y="138" width="3" height="5"/>
        <rect x="800" y="128" width="3" height="6"/>
        <rect x="838" y="132" width="3" height="5"/>
        <rect x="852" y="136" width="2.5" height="4"/>
        <rect x="898" y="132" width="3" height="5"/>
      </g>

      <path d="M148 200 C140 128 162 84 148 28 C176 68 188 116 204 158 C220 108 236 68 248 22 C268 84 282 136 294 200 Z" fill="#07090d"/>
      <path d="M184 200 C176 136 188 90 178 48 C192 90 202 138 212 200 Z" fill="#151c26"/>
    </g>

    <!-- Mondrian -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.20;0.37;0.40;1" dur="30s" repeatCount="indefinite"/>
      <rect width="1000" height="200" fill="#f3f0e7"/>
      <rect x="250" y="0" width="446" height="140" fill="#e11d2e">
        <animate attributeName="fill" values="#e11d2e;#ef3344;#e11d2e" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="78" height="58" fill="#f1c40f"/>
      <rect x="88" y="150" width="152" height="50" fill="#f1c40f"/>
      <rect x="890" y="150" width="110" height="50" fill="#1d4ed8">
