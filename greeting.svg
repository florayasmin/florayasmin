          <ellipse cx="0" cy="-10" rx="5.2" ry="12" fill="url(#petalPink)" transform="rotate(144)"/>
          <ellipse cx="0" cy="-10" rx="5.2" ry="12" fill="url(#petalPink)" transform="rotate(216)"/>
          <ellipse cx="0" cy="-10" rx="5.2" ry="12" fill="url(#petalPink)" transform="rotate(288)"/>
          <circle r="4.8" fill="#f5d76e"/>
        </g>
      </g>

      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 4; 0 0; 9 -2; 0 0" dur="14s" repeatCount="indefinite"/>
        <g transform="translate(700 108) rotate(-18)">
          <ellipse cx="0" cy="0" rx="62" ry="20" fill="#274e38"/>
          <path d="M0 0 L54 -7" stroke="#173226" stroke-width="3"/>
